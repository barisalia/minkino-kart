<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><title>Minkino YouTube kapak yerleşimi</title><desc>Logo ve başlığı düzenleyin. Sağ alana kadraja özel karakter çizimini yerleştirin ve kilavuz grubunu gizleyin.</desc><rect id="fon" width="1280" height="720" fill="#fff8e8"/><g id="logo-alani" transform="translate(44 68)" font-family="Arial Rounded MT Bold,Arial,sans-serif" font-weight="900" font-size="46" stroke="black" stroke-width="6" stroke-linejoin="round" paint-order="stroke"><text><tspan fill="#fa3981">MIN</tspan><tspan fill="#40d577">KINO</tspan></text></g><g id="baslik" font-family="Arial Rounded MT Bold,Arial,sans-serif" font-weight="900" font-size="100" stroke="black" stroke-width="12" stroke-linejoin="round" paint-order="stroke"><text x="42" y="276" fill="#ffcf22">TEK</text><text x="42" y="389" fill="#fa3981">BAŞIMA</text><text x="42" y="502" fill="#40d577">SÜRDÜM!</text></g><g id="karakter"></g><g id="kilavuz" fill="none" stroke="#638b81" stroke-width="2" stroke-dasharray="10 8"><rect x="578" y="35" width="665" height="650" rx="18"/><text x="910" y="360" text-anchor="middle" stroke="none" fill="#34645b" font-family="Arial" font-size="25">Karakter ve bölümün ana eşyası</text></g></svg>
