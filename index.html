<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#BFE6FF" />
    <meta name="description" content="Minkino — 3-6 yaş için sesli, eğitici oyunlar" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Minkino" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./ikon-180.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Minkino</title>
    <script>
      // Kartlar eskiden sitenin kökündeydi: eski Kartlar bağlantıları (?yas=…, ?tema=…, ?kategori=…) /kartlar/'a gider
      (function () {
        var q = new URLSearchParams(location.search);
        if (['yas', 'tema', 'mod', 'tip', 'kategori'].some(function (k) { return q.has(k); })) location.replace('./kartlar/' + location.search + location.hash);
      })();
    </script>
    <style>
      /* açılış: JS yüklenene kadar beyaz değil, açılış ekranının kremi + logo (uygulamada yerel açılış görseliyle aynı) */
      html, body { margin: 0; background: #fff4dd; }
      #acilis { position: fixed; inset: 0; z-index: 200; display: grid; place-items: center; background: #fff4dd; transition: opacity 0.32s ease-out; }
      #acilis img { width: min(62vw, 360px); height: auto; animation: acilis-nefes 1.6s ease-in-out infinite alternate; transition: transform 0.32s ease-out; }
      #acilis.gitti { opacity: 0; pointer-events: none; }
      #acilis.gitti img { transform: scale(1.12); animation: none; }
      @keyframes acilis-nefes { to { transform: scale(1.04); } }
      @media (prefers-reduced-motion: reduce) { #acilis img { animation: none; } }
    </style>
  </head>
  <body>
    <div id="acilis" aria-hidden="true"><img src="./assets/uygulama/logo-minkino.png" alt="" width="1159" height="286" /></div>
    <div id="minkino"></div>
    <script type="module" src="./uygulama/src/main.ts"></script>
  </body>
</html>
