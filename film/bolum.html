<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="robots" content="noindex" />
    <title>Kino ve Ailesi · bölüm önizleme</title>
    <style>
      html,
      body {
        margin: 0;
        background: #1d1712;
        color: #f3e6d4;
        font: 14px Fredoka, system-ui, sans-serif;
        overflow: hidden;
      }
      .f2-tuval {
        display: block;
        margin: 0 auto;
      }
      .f2-cubuk {
        display: flex;
        gap: 10px;
        align-items: center;
        padding: 8px 12px;
        height: 40px;
        box-sizing: border-box;
      }
      .f2-cubuk input[type='range'] {
        flex: 1;
      }
      .f2-cubuk button,
      .f2-cubuk select {
        font: inherit;
        background: #3a2b20;
        color: inherit;
        border: 1px solid #6b4e3a;
        border-radius: 8px;
        padding: 4px 10px;
      }
      .f2-panel {
        position: fixed;
        right: 12px;
        bottom: 56px;
        max-width: 70vw;
        max-height: 60vh;
        overflow: auto;
        background: rgba(20, 14, 10, 0.94);
        border: 1px solid #6b4e3a;
        border-radius: 10px;
        padding: 12px;
        white-space: pre-wrap;
        font-size: 12px;
      }
      .f2-durum {
        padding: 20px;
      }
    </style>
  </head>
  <body>
    <!-- Yalnız geliştirme: Kino ve Ailesi bölüm önizleme ve YouTube kaydı (film/src/film2/main.ts). Derlemeye girmez. -->

    <script type="module" src="./src/film2/main.ts"></script>
  </body>
