<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kino • Bahar Şenliği</title><style>
*{box-sizing:border-box}body{margin:0;background:#102d33;display:grid;place-items:center;height:100dvh}main{position:relative;width:min(100vw,177.778dvh);aspect-ratio:16/9;container-type:inline-size;overflow:hidden;background:#addfec;color:#19242b;font-family:Ink,sans-serif}canvas,#layer{position:absolute;inset:0;width:100%;height:100%}#layer{pointer-events:none}button{pointer-events:auto;font:inherit;cursor:pointer}button:focus-visible{outline:5px solid #27b6ff;outline-offset:-6px}.action,.flag,.title,.opt,.bubble{position:absolute}.action{background:#ffdb58;color:#17272c;border:.25cqw solid #19282d;border-radius:.55cqw;box-shadow:.3cqw .35cqw #19282d;letter-spacing:.07em;padding:.48em 1.3em;font-size:2.65cqw}.title{left:4%;top:8%;transform:rotate(-3deg);color:#fff9df;font-size:7.2cqw;line-height:.91;letter-spacing:.03em;-webkit-text-stroke:.45cqw #19282d;paint-order:stroke fill;text-shadow:.42cqw .5cqw #19282d}.title small{display:block;font-size:2.55cqw;line-height:1.7;color:#ffe06b}.flag{left:3%;top:4%;font-size:2.2cqw;letter-spacing:.045em;background:#ffe279;border:.21cqw solid #222c2c;padding:.15em .8em;transform:rotate(-2deg);box-shadow:.22cqw .25cqw #222c2c}.bubble{left:3%;top:8%;width:40%;padding:2.3% 2%;text-align:center;font-size:3.55cqw;line-height:1;letter-spacing:.03em;background:#fffbed;border:.32cqw solid #18272d;border-radius:50%;transform:rotate(-4deg);box-shadow:.22cqw .3cqw #18272d}.bubble:after{content:'';position:absolute;bottom:-1.0cqw;left:28%;height:1.8cqw;width:2cqw;background:#fffbed;border-right:.3cqw solid #18272d;border-bottom:.3cqw solid #18272d;transform:skew(-26deg) rotate(32deg)}
.opt{width:46%;height:29%;right:2.3%;border:0;background:#17272d;box-shadow:.3cqw .32cqw #152329;padding:.25cqw;transform:rotate(-1deg);transition:filter .15s;overflow:hidden}.opt:nth-of-type(2){transform:rotate(.8deg);right:3.4%}.opt:hover{filter:brightness(1.07)}.opt img{width:100%;height:100%;object-fit:cover;object-position:50% 42%;display:block}.opt span{position:absolute;left:2%;bottom:2%;background:var(--ticket) center/100% 100% no-repeat;padding:.38em .95em .41em 1.15em;color:#1b2632;font-size:2.18cqw;letter-spacing:.035em;line-height:1}.num{position:absolute;right:.35em;top:.25em;color:white;background:#1a2930;padding:.08em .35em;font:normal 1.9cqw Ink}.sub{position:absolute;left:50%;bottom:3%;transform:translateX(-50%);max-width:88%;width:max-content;text-align:center;font:650 clamp(10px,1.65cqw,32px)/1.28 'Trebuchet MS',sans-serif;background:#14282be8;color:white;border-radius:.65cqw;padding:.35em .75em;pointer-events:none}.sub:empty{display:none}#zoom{position:absolute;object-fit:cover;pointer-events:none}#zoom[hidden]{display:none}
.opt:first-of-type img,.opt:last-of-type img{object-position:50% 71%}@media(orientation:portrait){main{position:absolute;left:50%;top:50%;width:min(100dvh,177.778vw);transform:translate(-50%,-50%) rotate(90deg)}}</style><main><canvas width="1600" height="900"></canvas><div id="layer"></div><img id="zoom" hidden alt=""><div class="sub" aria-live="polite"></div></main><script>
const {files,rig,lines,align}=/*DATA*/;
const I={},cv=document.querySelector('canvas'),g=cv.getContext('2d'),main=document.querySelector('main'),L=document.querySelector('#layer'),sub=document.querySelector('.sub'),zoom=document.querySelector('#zoom'),voice=new Audio(),music=new Audio(files.music);music.loop=true;music.volume=.065;
let mode='boot',time=0,sp=-1,audio,cam=0,scale=1,K=390,D=0,B=730,ky=799,dy=791,by=797,bh=90,kpose='kino',kp=true,dad=false,bird=true,box=false,boxX=700,boxY=800,dream=-1,fly=0,band=0,wig=0,walk=0,dwalk=0,dscale=1,boxBird=false,dir=-1,hold=false;
const clamp=x=>Math.max(0,Math.min(1,x)),ease=t=>(t=clamp(t),t*t*(3-2*t)),mix=(a,b,t)=>a+(b-a)*t,wait=ms=>new Promise(r=>setTimeout(r,ms));
function tween(ms,fn){return new Promise(end=>{const start=performance.now();function step(t){let p=clamp((t-start)/ms);fn(ease(p),p);p<1?requestAnimationFrame(step):end()}requestAnimationFrame(step)})}
function tag(cls,txt){let n=document.createElement('div');n.className=cls;n.textContent=txt;L.append(n);return n}function btn(txt,fn,x,y){let n=document.createElement('button');n.className='action';n.textContent=txt;n.style.left=x+'%';n.style.top=y+'%';n.onclick=fn;L.append(n);return n}
function tone(f,to,len=.14,v=.035){if(!audio)return;let t=audio.currentTime,o=audio.createOscillator(),a=audio.createGain();o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(to,t+len);a.gain.setValueAtTime(.0001,t);a.gain.exponentialRampToValueAtTime(v,t+.015);a.gain.exponentialRampToValueAtTime(.0001,t+len);o.connect(a).connect(audio.destination);o.start(t);o.stop(t+len+.01)}function chirp(){tone(1900,2900);setTimeout(()=>tone(2400,1850,.11),170)}
function say(i){sp=i;sub.textContent=lines[i][1];voice.src=files['v'+i];return new Promise(r=>{function end(){voice.onended=voice.onerror=null;sp=-1;sub.textContent='';r()}voice.onended=voice.onerror=end;voice.play().catch(end)})}
function img(k,x,y,h,flip=false,rot=0){let im=I[k],w=h*im.width/im.height;g.save();g.translate(x,y);g.rotate(rot);g.scale(flip?-1:1,1);g.drawImage(im,-w/2,-h,w,h);g.restore()}
function shadow(x,y,w){g.fillStyle='rgba(48,70,42,.18)';g.beginPath();g.ellipse(x,y,w,w*.13,0,0,7);g.fill()}
function actor(k,x,y,h,who,flip=false,step=0){shadow(x,y,h*.22);let leap=step?Math.abs(Math.sin(step))*7:0;g.save();g.translate(x,y-leap);g.scale(flip?-1:1,1+Math.sin(time*2.6)*.003);g.rotate(step?Math.sin(step)*.028:0);
if(!rig[k])img(k,0,0,h);else{let im=I[k+'-govde'],w=h*im.width/im.height;g.drawImage(im,-w/2,-h,w,h);let [mx,my,mw,mh]=rig[k],open=.12;if(sp>=0&&lines[sp][0]===who){let a=align[sp],j=a.character_end_times_seconds.findIndex(t=>t>=voice.currentTime),c=a.characters[j]||' ';open=/[aeouöü]/i.test(c)?.94:/[ıi]/i.test(c)?.55:/[mbp\s.,!?]/i.test(c)?.12:.45}let xx=w*(mx-.5),yy=h*(my-1);if(open>.2)g.drawImage(I[(k==='kneel'?'kino':k)+'-agiz'],xx,yy,w*mw,h*(k==='kneel'?.043:mh)*open);else{g.beginPath();g.moveTo(xx,yy+2);g.quadraticCurveTo(xx+w*mw*.5,yy+w*mw*.18,xx+w*mw,yy);g.strokeStyle='#21191b';g.lineWidth=2.6;g.stroke()}}
g.restore()}
function draw(t){time=t/1000;g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,1600,900);g.save();g.scale(scale,scale);g.translate(-cam,-900*(1-1/scale));g.drawImage(I.street,0,0,2700,900);
if(dad)actor('baba',D,dy,460*dscale,'baba',dir>0,dwalk);if(box&&!hold){shadow(boxX,boxY,64);img('box',boxX,boxY,112);if(boxBird)img('bird',boxX+6,boxY-68,52)}
if(kp)actor(kpose,K,ky,kpose==='reach'?278:kpose==='kneel'?318:kpose==='kum'?300:366,'kino',false,walk);
if(bird){let y=by-fly+Math.sin(time*4)*1.5;shadow(B,by,31);img(wig>.1&&Math.sin(time*22)>0?'flap':'bird',B,y,bh,false,wig*.11*Math.sin(time*17))}
if(band>0){g.save();g.translate(B+22,by-bh*.52-80*(1-band));g.rotate(-.48);g.fillStyle='#f8bd84';g.strokeStyle='#442f24';g.lineWidth=2;g.beginPath();g.roundRect(-24,-8,48,16,6);g.fill();g.stroke();g.fillStyle='#e8a16a';g.fillRect(-7,-6,14,12);g.restore()}
g.restore();requestAnimationFrame(draw)}
function reset(){cam=0;scale=1;K=390;ky=800;B=730;by=797;bh=90;kpose='kino';kp=true;dad=box=boxBird=hold=false;bird=true;band=wig=fly=walk=dwalk=0;dscale=1;dir=-1}
function cover(){reset();mode='cover';L.replaceChildren();let n=tag('title','Bahar Şenliği');let s=document.createElement('small');s.textContent='KİNO İLE • İLK KARAR';n.prepend(s);btn('Hikâyeyi başlat',start,4,33)}
async function start(){if(mode!=='cover')return;mode='intro';L.replaceChildren();audio??=new AudioContext();audio.resume();music.currentTime=0;music.volume=.065;music.play().catch(()=>{});K=100;await Promise.all([say(0),tween(2500,(p,q)=>{walk=q*15;K=mix(100,445,p)})]);walk=0;chirp();await say(1);await Promise.all([say(2),tween(2700,(p,q)=>{scale=mix(1,1.52,p);cam=mix(0,190,p);wig=Math.sin(q*Math.PI);fly=16*Math.sin(q*Math.PI*2)**2})]);wig=fly=0;kpose='kneel';await say(3);await chooseScreen()}
async function chooseScreen(){await tween(440,p=>{scale=mix(1.52,1.45,p);cam=mix(190,235,p)});mode='choice';L.replaceChildren();tag('bubble','Kino şimdi ne yapsın?');for(let i=0;i<3;i++){let n=document.createElement('button');n.className='opt';n.style.top=(3+i*32)+'%';let label=['Yara bandı yapıştırsın','Havaya bırakıp uçursun','Kutuyla Nehir Abla’ya götürsün'][i];n.setAttribute('aria-label',label);n.innerHTML='<img alt=""><i class="num">0'+(i+1)+'</i><span></span>';n.firstChild.src=files['card'+'ABC'[i]];n.lastChild.textContent=label;n.onclick=()=>choose(i,n);L.append(n)}}
async function choose(i,n){if(mode!=='choice')return;mode='transition';let rect={left:n.offsetLeft,top:n.offsetTop,width:n.offsetWidth,height:n.offsetHeight},parent={left:0,top:0,width:main.clientWidth,height:main.clientHeight};zoom.src=n.firstChild.src;zoom.hidden=false;L.replaceChildren();let x=rect.left-parent.left,y=rect.top-parent.top;await tween(500,p=>{Object.assign(zoom.style,{left:mix(x,0,p)+'px',top:mix(y,0,p)+'px',width:mix(rect.width,parent.width,p)+'px',height:mix(rect.height,parent.height,p)+'px',opacity:1})});if(i<2)tag('flag','Kino hayal ediyor…');await wait(340);await tween(480,p=>zoom.style.opacity=1-p);zoom.hidden=true;
if(i<2){mode='dream';await say(i===0?4:6);if(!i){await tween(680,p=>{band=p});await tween(700,(p,q)=>{wig=Math.sin(q*Math.PI);fly=8*Math.sin(q*Math.PI);band=1-.1*Math.sin(q*Math.PI)})}else{await tween(850,(p,q)=>{K=mix(445,655,p);walk=q*5});walk=0;kpose='reach';bird=false;await wait(480);kpose='kneel';bird=true;chirp();await tween(1250,(p,q)=>{fly=100*(1-q)+105*Math.sin(Math.PI*q);wig=Math.sin(Math.PI*q)});tone(440,300,.16,.02)}await say(i===0?5:7);await tween(430,p=>band=(1-p)*(i===0?1:0));L.replaceChildren();let oldK=K;cam=235;scale=1.45;await tween(380,p=>{K=mix(oldK,445,p);cam=mix(235,190,p);scale=mix(1.45,1.52,p)});await chooseScreen();return}
mode='rescue';await say(8);await tween(1700,(p,q)=>{dad=true;D=mix(1320,910,p);dwalk=q*12;box=true;boxX=D-85;boxY=dy-165;cam=mix(235,165,p);scale=mix(1.45,1.25,p)});dwalk=0;await say(9);await tween(800,p=>{boxX=mix(825,780,p);boxY=mix(626,795,p)});let narration=say(10);await tween(900,(p,q)=>{K=mix(445,660,p);walk=q*6;kpose='kino'});walk=0;kpose='reach';bird=false;await wait(650);await tween(590,p=>{K=mix(660,708,p);ky=mix(800,789,p)});kpose='carry';box=false;await wait(320);dir=1;await tween(5400,(p,q)=>{K=mix(708,2170,p);D=mix(910,2360,p);cam=mix(165,1418,p);scale=mix(1.25,1.29,p);let gate=Math.sin(Math.min(1,q*2)*Math.PI/2);ky=mix(789,705,gate);dy=mix(791,703,gate);kpose=Math.sin(q*39)>.05?'pass':'carry';walk=dwalk=q*39});walk=dwalk=0;dir=-1;await narration;await say(11);await say(12);await tween(650,p=>{ky=mix(705,727,p)});kpose='kneel';box=true;boxBird=true;boxX=K+117;boxY=722;tone(830,1090,.2,.018);tag('flag','Pati Dükkânı • Nehir Abla');await say(13);mode='end';L.replaceChildren();tag('flag','Küçük kuş artık emin ellerde');btn('Yeniden oyna',()=>{music.pause();cover()},4,16);music.volume=.04}
(async()=>{const face=new FontFace('Ink','url('+files.font+')');document.fonts.add(await face.load());main.style.setProperty('--ticket','url('+files.ticket+')');await Promise.all(Object.entries(files).filter(([,v])=>v.startsWith('data:image')).map(async([k,v])=>{let a=new Image();a.src=v;await a.decode();I[k]=a}));cover();requestAnimationFrame(draw)})()
</script></html>
