name: Yayınla (GitHub Pages)

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:
    inputs:
      ses_duzelt:
        description: 'Sadece sorunlu kayıtları yeniden üret (kısa kelimeler + hızlı olanlar + eksikler)'
        type: boolean
        default: false
      ses_karsilastir:
        description: 'Model karşılaştırma kayıtları üret (ses-deneme.html)'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write

concurrency:
  group: yayinla
  cancel-in-progress: false

jobs:
  yayinla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Recraft görsellerini indir
        run: node scripts/gorsel-indir.mjs

      - name: Model karşılaştırma kayıtları (ElevenLabs)
        if: ${{ inputs.ses_karsilastir }}
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: npx vite-node scripts/seslendir.ts -- --karsilastir

      - name: Eksik seslendirmeleri üret (ElevenLabs)
        if: ${{ !inputs.ses_karsilastir }}
        continue-on-error: true
        timeout-minutes: 180
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: npx vite-node scripts/seslendir.ts -- ${{ inputs.ses_duzelt && '--duzelt' || '' }}

      - name: Eksik ses efektlerini üret (ElevenLabs Sound Effects)
        if: ${{ !inputs.ses_karsilastir }}
        continue-on-error: true
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: node scripts/efekt-sesleri.mjs

      - name: Yeni görsel ve sesleri repoya kaydet
        continue-on-error: true
        run: |
          git add assets public/ses public/ses-ornek karakter-kaynak 2>/dev/null || git add assets public/ses
          if ! git diff --cached --quiet; then
            git -c user.name="minkino-bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Görsel/ses dosyaları güncellendi [skip ci]"
            git pull --rebase -q origin "${GITHUB_REF_NAME}" || true
            git push
          fi

      - name: Birim testleri
        continue-on-error: true
        run: npm test

      - run: npm run build

      - name: gh-pages dalına yayınla
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
          commit_message: 'Yayın: ${{ github.sha }}'

      - name: Pages'i etkinleştirmeyi dene (ilk sefer)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/${{ github.repository }}/pages >/dev/null 2>&1 \
            || gh api -X POST repos/${{ github.repository }}/pages -f 'source[branch]=gh-pages' -f 'source[path]=/'
