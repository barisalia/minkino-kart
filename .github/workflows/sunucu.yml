name: Sihir sunucusu (Cloudflare)

on:
  push:
    branches: [main, 'claude/**']
    paths: ['sunucu/**', '.github/workflows/sunucu.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  kur:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      RECRAFT_API_KEY: ${{ secrets.RECRAFT_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Anahtarlar var mı?
        id: kontrol
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare anahtarları eklenmemiş (CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID) — kurulum atlandı."
            echo "hazir=0" >> "$GITHUB_OUTPUT"
          else
            echo "hazir=1" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.kontrol.outputs.hazir == '1'
        with:
          node-version: 22

      - name: Worker'ı yayınla
        if: steps.kontrol.outputs.hazir == '1'
        id: yayin
        working-directory: sunucu/sihir
        run: |
          npx --yes wrangler@4 deploy 2>&1 | tee yayin.log
          ADRES=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' yayin.log | head -1)
          echo "adres=$ADRES" >> "$GITHUB_OUTPUT"
          echo "Sunucu adresi: $ADRES"

      - name: Gizli anahtarları yükle
        if: steps.kontrol.outputs.hazir == '1'
        working-directory: sunucu/sihir
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then echo "$GEMINI_API_KEY" | npx --yes wrangler@4 secret put GEMINI_API_KEY; fi
          if [ -n "$RECRAFT_API_KEY" ]; then echo "$RECRAFT_API_KEY" | npx --yes wrangler@4 secret put RECRAFT_API_KEY; fi

      - name: Sunucu adresini uygulamaya yaz
        if: steps.kontrol.outputs.hazir == '1' && steps.yayin.outputs.adres != ''
        env:
          ADRES: ${{ steps.yayin.outputs.adres }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "{ \"sunucu\": \"$ADRES\" }" > public/sanatci/ayar.json
          git add public/sanatci/ayar.json
          if ! git diff --cached --quiet; then
            git -c user.name="minkino-bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Minik Sanatçı: sihir sunucusu adresi [skip ci]"
            git pull --rebase -q origin "${GITHUB_REF_NAME}" || true
            git push
            gh workflow run yayinla.yml --ref "${GITHUB_REF_NAME}"
          fi
          curl -s "$ADRES/" || true

      - name: Sihir denemesi (3 örnek karalama)
        if: steps.kontrol.outputs.hazir == '1' && steps.yayin.outputs.adres != ''
        env:
          ADRES: ${{ steps.yayin.outputs.adres }}
        run: |
          sleep 5
          python3 -c "import PIL" 2>/dev/null || python3 -m pip install -q --user --break-system-packages pillow
          mkdir -p sanatci/deneme
          for ad in kedi ev araba; do
            python3 -c "
          import base64, io, json
          from PIL import Image
          ham = open('sanatci/ornekler/$ad.png','rb').read()
          k = Image.open(io.BytesIO(ham)).convert('RGBA')
          zemin = Image.new('RGB', k.size, 'white'); zemin.paste(k, mask=k.split()[3])
          b = io.BytesIO(); zemin.resize((504, 504)).save(b, 'PNG')
          print(json.dumps({'resim': base64.b64encode(ham).decode(), 'kucuk': base64.b64encode(b.getvalue()).decode(), 'konu': '$ad'}))
          " > istek.json
            curl -s -X POST "$ADRES/sihir" -H 'Content-Type: application/json' -H 'Origin: https://barisalia.github.io' --data @istek.json -o yanit.json -w "$ad HTTP %{http_code}\n" || true
            python3 - "$ad" <<'PY'
          import base64, json, sys
          ad = sys.argv[1]
          try:
              j = json.load(open('yanit.json'))
          except Exception as e:
              print(ad, 'yanıt okunamadı', e); sys.exit(0)
          if j.get('resim'):
              open(f'sanatci/deneme/{ad}.png', 'wb').write(base64.b64decode(j['resim']))
              print(ad, 'tamam, motor:', j.get('motor'))
          else:
              print(ad, 'HATA:', j.get('hata'))
              open(f'sanatci/deneme/{ad}-hata.txt', 'w').write(str(j.get('hata')))
          PY
          done
          git add sanatci/deneme
          if ! git diff --cached --quiet; then
            git -c user.name="minkino-bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Minik Sanatçı: sunucu deneme sonuçları [skip ci]"
            git pull --rebase -q origin "${GITHUB_REF_NAME}" || true
            git push
          fi
